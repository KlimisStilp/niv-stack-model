[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niv-stack-model"
version = "0.1.0"
description = "Data acquisition for a stacked probabilistic GB Net Imbalance Volume (NIV) forecasting model (2-40 h ahead)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "requests>=2.31",
    "numpy>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "ondil>=0.4",       # GAMLSS-type distributional regression (GPL-3.0; see README licence note)
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
entsoe = ["entsoe-py>=0.6"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
niv = "niv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: slower model-fitting tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
